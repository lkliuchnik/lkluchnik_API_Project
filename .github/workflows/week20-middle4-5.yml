name: API tests — Week 20 (Middle Stage 4-5)

# What runs when (the suites are npm scripts in package.json, the tags are in config/tags.ts):
#   pull request to main   smoke        a few fast happy paths - quick feedback on every push to the PR
#   push to main           regression   every test except the slow ones - main must stay green
#   every night            full         everything, also the 1-minute token test (@slow)
#   by hand                any suite    Actions > this workflow > Run workflow > choose the suite
# The API + UI test (@ui) runs in its own job, for regression and full only.
on:
  pull_request:
    branches: [main]
    paths:
      - "Week20. Middle Stage 4-5/**"
      - ".github/workflows/week20-middle4-5.yml"
  push:
    branches: [main]
    paths:
      - "Week20. Middle Stage 4-5/**"
      - ".github/workflows/week20-middle4-5.yml"
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC every night; GitHub runs it from the workflow file on main
  workflow_dispatch:
    inputs:
      suite:
        description: Which tests to run
        type: choice
        options: [smoke, regression, full]
        default: regression

permissions:
  contents: read # the jobs only read the code

concurrency:
  # one group per event, branch and (for a run by hand) suite
  group: week20-${{ github.event_name }}-${{ inputs.suite }}-${{ github.ref }}
  # only a pull request cancels its older run (a newer push replaces it); a run on main or a
  # night run is never cancelled - every commit on main gets its finished regression result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # the suite of this run, from the event that started it
  SUITE: ${{ github.event_name == 'pull_request' && 'smoke' || github.event_name == 'schedule' && 'full' || inputs.suite || 'regression' }}

jobs:
  test:
    name: test (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # one red environment does not stop the other
      matrix:
        environment: [dev, staging] # the same code, two environments (config/environments.ts)
    defaults:
      run:
        working-directory: "Week20. Middle Stage 4-5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "Week20. Middle Stage 4-5/package-lock.json"
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Every test is in a suite
        # a test without Tag.REGRESSION or Tag.SLOW would silently miss the regression suite
        run: |
          untagged=$(npx playwright test --list --grep-invert "@regression|@slow" | grep "›" || true)
          if [ -n "$untagged" ]; then
            echo "Tests without a suite tag (add Tag.REGRESSION or Tag.SLOW, config/tags.ts):"
            echo "$untagged"
            exit 1
          fi
      - name: Suite
        run: echo "Suite **${SUITE}** (event ${{ github.event_name }}), environment **${{ matrix.environment }}**" >> "$GITHUB_STEP_SUMMARY"
      - name: API tests
        run: npm run "test:${SUITE}" -- --grep-invert @ui # the UI test has its own job
        env:
          TEST_ENV: ${{ matrix.environment }}
          # secrets: never in the code or in this file (config/environments.ts reads them).
          # Each environment gets only its own password.
          DUMMYJSON_PASSWORD_DEV: ${{ matrix.environment == 'dev' && secrets.DUMMYJSON_PASSWORD_DEV || '' }}
          DUMMYJSON_PASSWORD_STAGING: ${{ matrix.environment == 'staging' && secrets.DUMMYJSON_PASSWORD_STAGING || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-week20-${{ env.SUITE }}-${{ matrix.environment }}
          path: "Week20. Middle Stage 4-5/playwright-report/"
          retention-days: 14

  # The API + UI test needs a browser and depends on the demoqa.com web page, which is slower
  # and less stable than the APIs. A separate job keeps a UI problem from hiding API results.
  # Not for smoke: a pull request gets quick API feedback only.
  ui-test:
    name: ui-test (dev)
    if: github.event_name != 'pull_request' && inputs.suite != 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "Week20. Middle Stage 4-5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "Week20. Middle Stage 4-5/package-lock.json"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep @ui
        env:
          TEST_ENV: dev # no secrets: the UI test uses DemoQA only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-week20-ui
          path: "Week20. Middle Stage 4-5/playwright-report/"
          retention-days: 14
