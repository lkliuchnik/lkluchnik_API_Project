name: API tests — Week 19 (Middle Stage 2-3)
on:
  push:
    branches: [main]
    paths:
      - "Week19. Middle Stage 2-3/**"
      - ".github/workflows/week19-middle2-3.yml"
  pull_request:
    branches: [main]
    paths:
      - "Week19. Middle Stage 2-3/**"
      - ".github/workflows/week19-middle2-3.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Week19. Middle Stage 2-3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "Week19. Middle Stage 2-3/package-lock.json"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx playwright test
        env:
          BASE_URL: https://dummyjson.com
          AUTH_USERNAME: emilys
          AUTH_PASSWORD: emilyspass
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-week19
          path: "Week19. Middle Stage 2-3/playwright-report/"
          retention-days: 14
